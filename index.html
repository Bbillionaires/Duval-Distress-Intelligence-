<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distress Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background:#0b1320; }
    .card { background:#0f172a; border:1px solid rgba(148,163,184,.12); }
    .pill { background:#0b2530; border:1px solid rgba(148,163,184,.12); }
    .tag { background:#0e1a2b; border:1px solid rgba(148,163,184,.18); }
    .btn { background:#22c55e; }
    .btn[disabled] { opacity:.6; cursor:not-allowed; }
    .btn-ghost { background:#2b3345; }
    .input { background:#0e1729; border:1px solid rgba(148,163,184,.15); }
  </style>
</head>
<body class="text-slate-200 antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 rounded-full flex items-center justify-center font-bold text-slate-900" style="background:#22c55e">DI</div>
        <div>
          <div class="text-2xl font-semibold">Distress Intelligence</div>
          <div class="text-sm text-slate-400">Pre-market Duval distress data · MVP</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="userEmail" class="text-sm text-slate-400"></span>
        <button id="logoutBtn" class="px-4 py-2 rounded-xl btn-ghost">Logout</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card rounded-2xl p-5 mb-6">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-slate-400">Search owner / address / parcel</label>
          <input id="q" class="mt-1 w-full input rounded-xl px-4 py-3" placeholder="e.g. Smith, 125 Main, 12345-0000">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-sm text-slate-400">Zip</label>
            <input id="zip" class="mt-1 w-full input rounded-xl px-4 py-3" placeholder="32209">
          </div>
          <div>
            <label class="text-sm text-slate-400">Min amount due</label>
            <input id="min_amount" class="mt-1 w-full input rounded-xl px-4 py-3" placeholder="10000" inputmode="numeric">
          </div>
          <div>
            <label class="text-sm text-slate-400">Max amount due</label>
            <input id="max_amount" class="mt-1 w-full input rounded-xl px-4 py-3" placeholder="50000" inputmode="numeric">
          </div>
        </div>
      </div>

      <div class="mt-4">
        <label class="text-sm text-slate-400">Distress sources</label>
        <div id="sourcePills" class="flex flex-wrap gap-3 mt-2">
          <button data-src="tax" class="px-4 py-2 rounded-full pill active">Tax</button>
          <button data-src="nuisance" class="px-4 py-2 rounded-full pill">Nuisance / Code</button>
          <button data-src="fire" class="px-4 py-2 rounded-full pill">Fire / Unsafe</button>
          <button data-src="probate" class="px-4 py-2 rounded-full pill">Probate</button>
          <button data-src="lis" class="px-4 py-2 rounded-full pill">Lis Pendens</button>
        </div>
      </div>

      <div class="mt-6 grid sm:grid-cols-2 gap-3">
        <button id="exportBtn" class="w-full py-3 rounded-xl btn font-medium">Export Now (CSV)</button>
        <button id="refreshBtn" class="w-full py-3 rounded-xl btn-ghost font-medium">Refresh Leads</button>
      </div>

      <div id="matchNote" class="text-sm text-slate-400 mt-3">0 matching properties</div>
    </div>

    <!-- Table -->
    <div class="card rounded-2xl p-5">
      <div class="flex items-center justify-between mb-3">
        <div class="text-lg font-semibold">Distressed Parcels</div>
        <div class="text-sm text-slate-400">Showing <span id="shownCount">0</span> of <span id="totalCount">0</span> total</div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="text-slate-400">
            <tr class="text-left">
              <th class="py-2 pr-4">Owner</th>
              <th class="py-2 pr-4">Property Address</th>
              <th class="py-2 pr-4">Parcel</th>
              <th class="py-2 pr-4">Zip</th>
              <th class="py-2 pr-4">Distress</th>
              <th class="py-2 pr-4 text-right">Amount Due</th>
              <th class="py-2 pl-4">Action</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="text-center text-slate-400 py-10 hidden">
        No leads match your filters yet.
      </div>
    </div>
  </div>

  <script>
    // ------------------ STATE ------------------
    let allLeads = [];
    let currentLeads = [];

    // which sources are selected
    const selectedSources = new Set(["tax"]); // default Tax

    // ------------------ UI HELPERS ------------------
    function money(v) {
      if (v == null || v === "") return "";
      const n = Number(String(v).replace(/[^0-9.-]/g,""));
      if (Number.isNaN(n)) return v;
      return n.toLocaleString('en-US',{ style:'currency', currency:'USD', maximumFractionDigits:0 });
    }

    function pillActive(el, active) {
      if (active) el.classList.add("ring-2","ring-emerald-400");
      else el.classList.remove("ring-2","ring-emerald-400");
    }

    function updateCounts() {
      document.getElementById('totalCount').textContent = allLeads.length;
      document.getElementById('shownCount').textContent = currentLeads.length;
      document.getElementById('matchNote').textContent = `${currentLeads.length} matching properties`;
      document.getElementById('emptyState').classList.toggle('hidden', currentLeads.length > 0);
    }

    // ------------------ RENDER TABLE ------------------
    function renderTable() {
      const tbody = document.getElementById('leadsBody');
      tbody.innerHTML = "";
      for (const lead of currentLeads) {
        const tr = document.createElement('tr');
        const tags = (lead.distressTypes || "").split(/[|,]/).map(s => s.trim()).filter(Boolean);

        tr.innerHTML = `
          <td class="py-2 pr-4 align-top">
            <div class="font-medium text-slate-100">${lead.owner || ""}</div>
            <div class="text-[11px] text-slate-500">${lead.mail || ""}</div>
          </td>
          <td class="py-2 pr-4 align-top">
            ${lead.propertyAddress || ""}
          </td>
          <td class="py-2 pr-4 align-top">${lead.parcel || ""}</td>
          <td class="py-2 pr-4 align-top">${lead.zip || ""}</td>
          <td class="py-2 pr-4 align-top">
            <div class="flex flex-wrap gap-1">
              ${tags.map(t => `<span class="tag px-2 py-0.5 rounded-full text-[11px]">${t}</span>`).join("")}
            </div>
          </td>
          <td class="py-2 pr-4 align-top text-right">${money(lead.amountDue)}</td>
          <td class="py-2 pl-4 align-top">
            <button class="px-3 py-1 rounded-xl text-[11px] btn-ghost">Skiptrace</button>
          </td>
        `;
        tbody.appendChild(tr);
      }
      updateCounts();
    }

    // ------------------ FILTER & LOAD ------------------
    function applyFilters() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const zip = document.getElementById('zip').value.trim();
      const minAmt = Number(document.getElementById('min_amount').value || 0);
      const maxAmt = Number(document.getElementById('max_amount').value || 0);
      const srcs = new Set([...selectedSources]);

      currentLeads = allLeads.filter(l => {
        // text search
        if (q) {
          const hay = `${l.owner||""}|${l.propertyAddress||""}|${l.parcel||""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        // zip
        if (zip && String(l.zip||"").indexOf(zip) !== 0) return false;

        // amount
        const amt = Number(String(l.amountDue||"").replace(/[^0-9.-]/g,"")) || 0;
        if (minAmt && amt < minAmt) return false;
        if (maxAmt && amt > maxAmt) return false;

        // sources / tags
        if (srcs.size) {
          const tags = (l.distressTypes || "").toLowerCase();
          let ok = false;
          for (const s of srcs) if (tags.includes(s)) { ok = true; break; }
          if (!ok) return false;
        }
        return true;
      });

      renderTable();
    }

    async function loadLeads() {
      const params = new URLSearchParams();
      if (selectedSources.size) params.set('sources', [...selectedSources].join(','));
      const url = `/api/leads?${params.toString()}`;
      const r = await fetch(url);
      const data = await r.json();
      if (!Array.isArray(data)) {
        console.warn('Unexpected /api/leads payload', data);
        allLeads = [];
      } else {
        allLeads = data;
      }
      applyFilters();
    }

    // ------------------ REFRESH BUTTON ------------------
    async function refreshAndReload() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = 'Refreshing…';
      try {
        const r = await fetch('/api/refresh', { method:'GET' });
        const j = await r.json();
        console.log('refresh', j);
        if (j.status !== 'success') {
          alert('Refresh failed: ' + (j.message || 'unknown error'));
        }
        await loadLeads();
      } catch (e) {
        alert('Refresh failed: ' + e);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    }

    // ------------------ EVENTS ------------------
    document.getElementById('refreshBtn').addEventListener('click', refreshAndReload);
    document.getElementById('exportBtn').addEventListener('click', () => {
      // simple CSV export of currentLeads
      const cols = ["owner","propertyAddress","parcel","zip","distressTypes","amountDue"];
      const header = cols.join(",");
      const rows = currentLeads.map(r => cols.map(c => `"${String(r[c]??"").replace(/"/g,'""')}"`).join(","));
      const csv = [header, ...rows].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'distress_leads.csv';
      a.click();
    });

    // source pill toggles
    document.querySelectorAll('#sourcePills [data-src]').forEach(btn => {
      const src = btn.getAttribute('data-src');
      pillActive(btn, selectedSources.has(src));
      btn.addEventListener('click', () => {
        if (selectedSources.has(src)) selectedSources.delete(src);
        else selectedSources.add(src);
        pillActive(btn, selectedSources.has(src));
        applyFilters();
      });
    });

    // input live filtering
    ['q','zip','min_amount','max_amount'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => applyFilters());
    });

    // mock auth label (optional – replace with your Firebase hook)
    (function setUser(){
      const email = (localStorage.getItem('di_user') || '').trim();
      if (email) document.getElementById('userEmail').textContent = email;
      document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('di_user');
        location.href = '/login';
      };
    })();

    // initial load
    loadLeads();
  </script>
</body>
</html>
