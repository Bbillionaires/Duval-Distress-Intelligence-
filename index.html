<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Distress Intelligence · Duval</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
  <script>
    // Replace with your actual Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDTMTNQceT5sbzJVnZknWOWF27G0KzYgPE",
      authDomain: "duval-distress-intelligence.firebaseapp.com",
      projectId: "duval-distress-intelligence",
      storageBucket: "duval-distress-intelligence.firebasestorage.app",
      messagingSenderId: "374769856603",
      appId: "1:374769856603:web:342062e92ef5d1c289cf7e"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Wrapper -->
  <div class="max-w-5xl mx-auto px-4 py-6">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-full bg-emerald-400 flex items-center justify-center font-bold text-slate-900">
          DI
        </div>
        <div>
          <h1 class="text-xl font-semibold">Distress Intelligence</h1>
          <p class="text-xs text-slate-400">Pre-market Duval distress data · MVP</p>
        </div>
      </div>
      <div id="authArea" class="text-xs text-slate-400">
        <!-- Firebase login status will go here -->
        <span id="userStatus" class="text-slate-300"></span>
        <button id="logoutBtn" class="hidden bg-slate-800 border border-slate-600 rounded-full px-3 py-1 text-[11px] ml-2">Logout</button>
      </div>
    </header>

    <!-- Filters Card -->
    <section class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 mb-4">
      <div class="grid gap-3 md:grid-cols-2">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Search owner / address / parcel</label>
          <input id="searchInput"
                 type="text"
                 placeholder="e.g. Smith, 125 Main, 12345-0000"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Zip</label>
            <input id="zipInput"
                   type="text"
                   placeholder="32209"
                   class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Min amount due</label>
            <input id="minAmountInput"
                   type="number"
                   placeholder="10000"
                   class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Max amount due</label>
            <input id="maxAmountInput"
                   type="number"
                   placeholder="50000"
                   class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>

      <div class="mt-4">
        <span class="text-xs text-slate-400 block mb-2">Distress sources</span>
        <div class="flex flex-wrap gap-2">
          <button data-source="tax"
                  class="distress-pill px-3 py-1 rounded-full text-xs border border-emerald-400 bg-emerald-500/10">
            Tax
          </button>
          <button data-source="nuisance"
                  class="distress-pill px-3 py-1 rounded-full text-xs border border-slate-600 bg-slate-800">
            Nuisance / Code
          </button>
          <button data-source="fire"
                  class="distress-pill px-3 py-1 rounded-full text-xs border border-slate-600 bg-slate-800">
            Fire / Unsafe
          </button>
          <button data-source="probate"
                  class="distress-pill px-3 py-1 rounded-full text-xs border border-slate-600 bg-slate-800">
            Probate
          </button>
          <button data-source="lis_pendens"
                  class="distress-pill px-3 py-1 rounded-full text-xs border border-slate-600 bg-slate-800">
            Lis Pendens
          </button>
        </div>
      </div>

      <div class="mt-4 flex flex-col md:flex-row items-stretch md:items-center gap-2">
        <button id="exportBtn"
                class="flex-1 md:flex-none md:px-6 rounded-full bg-emerald-400 text-slate-950 text-sm font-medium py-2 hover:bg-emerald-300">
          Export Now (CSV)
        </button>
        <button id="refreshBtn"
                class="flex-1 md:flex-none md:px-6 rounded-full bg-slate-800 text-slate-100 text-sm py-2 border border-slate-600 hover:bg-slate-700">
          Refresh Leads
        </button>
        <span id="summaryText" class="text-xs text-slate-400 md:ml-auto"></span>
      </div>
    </section>

    <!-- Table Card -->
    <section class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-semibold">Distressed Parcels</h2>
        <span id="tableMeta" class="text-xs text-slate-400"></span>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-xs text-left">
          <thead class="border-b border-slate-800 text-slate-400">
            <tr>
              <th class="py-2 pr-4">Owner</th>
              <th class="py-2 pr-4">Property Address</th>
              <th class="py-2 pr-4">Parcel</th>
              <th class="py-2 pr-4">Zip</th>
              <th class="py-2 pr-4">Distress</th>
              <th class="py-2 pr-4 text-right">Amount Due</th>
              <th class="py-2 pl-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="leadsBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast"
       class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-full shadow-lg">
  </div>

  <!-- Distress Intelligence Core Script -->
  <script>
    const API_BASE = "";
    let currentLeads = [];
    let activeSources = new Set(["tax"]);

    const searchInput = document.getElementById("searchInput");
    const zipInput = document.getElementById("zipInput");
    const minAmountInput = document.getElementById("minAmountInput");
    const maxAmountInput = document.getElementById("maxAmountInput");
    const exportBtn = document.getElementById("exportBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const summaryText = document.getElementById("summaryText");
    const tableMeta = document.getElementById("tableMeta");
    const leadsBody = document.getElementById("leadsBody");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    function getFilters() {
      const q = searchInput.value.trim();
      const zip = zipInput.value.trim();
      const minAmt = minAmountInput.value.trim();
      const maxAmt = maxAmountInput.value.trim();
      const sources = Array.from(activeSources).join(",");
      return { q, zip, minAmt, maxAmt, sources };
    }

    async function loadLeads() {
      const { q, zip, minAmt, maxAmt, sources } = getFilters();
      const params = new URLSearchParams();
      if (q) params.append("q", q);
      if (zip) params.append("zip", zip);
      if (minAmt) params.append("min_amount", minAmt);
      if (maxAmt) params.append("max_amount", maxAmt);
      if (sources) params.append("sources", sources);

      const res = await fetch(`/api/leads?${params.toString()}`);
      const data = await res.json();
      currentLeads = data.leads || [];

      summaryText.textContent = `${data.count} matching properties`;
      tableMeta.textContent = `Showing ${data.count} of ${data.total} total`;
      renderTable();
    }

    function renderTable() {
      leadsBody.innerHTML = "";
      if (!currentLeads.length) {
        leadsBody.innerHTML = `<tr><td colspan="7" class="py-4 text-center text-slate-500">No leads match your filters yet.</td></tr>`;
        return;
      }

      for (const lead of currentLeads) {
        const tr = document.createElement("tr");
        const tags = (lead.distressTypes || "").split("|").filter(Boolean);

        tr.innerHTML = `
          <td class="py-2 pr-4 align-top">
            <div class="font-medium text-slate-100">${lead.owner || "-"}</div>
            <div class="text-[11px] text-slate-500">Mail: ${lead.mailingAddress || "-"}</div>
          </td>
          <td class="py-2 pr-4 align-top">${lead.siteAddress || "-"}</td>
          <td class="py-2 pr-4 align-top text-slate-300">${lead.parcel || "-"}</td>
          <td class="py-2 pr-4 align-top text-slate-300">${lead.zip || "-"}</td>
          <td class="py-2 pr-4 align-top">
            <div class="flex flex-wrap gap-1">
              ${tags.map(t => `<span class="px-2 py-0.5 rounded-full bg-slate-800 text-[10px] border border-slate-600">${t}</span>`).join("")}
            </div>
          </td>
          <td class="py-2 pr-4 align-top text-right font-medium text-emerald-300">
            ${lead.amountDue ? "$" + Number(lead.amountDue).toLocaleString() : "-"}
          </td>
          <td class="py-2 pl-4 align-top text-right">
            <button class="px-3 py-1 text-[11px] rounded-full bg-sky-500 text-slate-900 font-medium hover:bg-sky-400" data-id="${lead.id}">Skiptrace</button>
          </td>`;
        const btn = tr.querySelector("button");
        btn.addEventListener("click", () => sendToSkiptrace(lead, btn));
        leadsBody.appendChild(tr);
      }
    }

    async function sendToSkiptrace(lead, buttonEl) {
      buttonEl.disabled = true;
      buttonEl.textContent = "Sending…";
      try {
        const res = await fetch("/api/skiptrace_order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lead, user: "web-client" })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Error");
        buttonEl.textContent = `Queued (${data.queue})`;
        buttonEl.classList.remove("bg-sky-500", "hover:bg-sky-400");
        buttonEl.classList.add("bg-emerald-500");
        showToast(`Sent to ${data.queue} queue`);
      } catch (e) {
        showToast("Skiptrace failed: " + e.message);
        buttonEl.disabled = false;
        buttonEl.textContent = "Skiptrace";
      }
    }

    async function exportCsv() {
      const { q, zip, minAmt, maxAmt, sources } = getFilters();
      const params = new URLSearchParams();
      if (q) params.append("q", q);
      if (zip) params.append("zip", zip);
      if (minAmt) params.append("min_amount", minAmt);
      if (maxAmt) params.append("max_amount", maxAmt);
      if (sources) params.append("sources", sources);
      const url = `/export?${params.toString()}`;
      window.location.href = url;
    }

    let filterTimeout = null;
    function scheduleReload() {
      if (filterTimeout) clearTimeout(filterTimeout);
      filterTimeout = setTimeout(loadLeads, 400);
    }

    document.querySelectorAll(".distress-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        const s = btn.getAttribute("data-source");
        if (activeSources.has(s)) {
          activeSources.delete(s);
          btn.classList.remove("border-emerald-400", "bg-emerald-500/10");
          btn.classList.add("border-slate-600", "bg-slate-800");
        } else {
          activeSources.add(s);
          btn.classList.add("border-emerald-400", "bg-emerald-500/10");
          btn.classList.remove("border-slate-600", "bg-slate-800");
        }
        scheduleReload();
      });
    });

    searchInput.addEventListener("input", scheduleReload);
    zipInput.addEventListener("input", scheduleReload);
    minAmountInput.addEventListener("input", scheduleReload);
    maxAmountInput.addEventListener("input", scheduleReload);
    exportBtn.addEventListener("click", exportCsv);
    refreshBtn.addEventListener("click", loadLeads);

    loadLeads();
  </script>
</body>
</html>
