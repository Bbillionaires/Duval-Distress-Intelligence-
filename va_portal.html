<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .timer-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #48bb78;
            color: white;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .job-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f7fafc;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-success { background: #48bb78; color: white; }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #f56565; color: white; }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        textarea, input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>💼 VA Portal</h1>
                <div id="vaInfo"></div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #667eea;" id="availableCount">0</div>
                <div style="color: #718096;">Available Jobs</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #48bb78;" id="activeCount">0</div>
                <div style="color: #718096;">Active Jobs</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #f59e0b;" id="pendingCount">0</div>
                <div style="color: #718096;">Pending Review</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #2d3748;" id="totalEarned">$0</div>
                <div style="color: #718096;">Total Earned</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="jobSearchInput" placeholder="🔍 Search by parcel, address, or service type..." 
                   style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px;"
                   oninput="applySearchAndFilter()">
        </div>

        <!-- Filter Tabs -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="btn btn-primary" id="filter-all" onclick="setFilter('all')">📋 All Jobs</button>
            <button class="btn btn-secondary" id="filter-available" onclick="setFilter('available')">🎯 Available</button>
            <button class="btn btn-secondary" id="filter-active" onclick="setFilter('active')">⚡ Active</button>
            <button class="btn btn-secondary" id="filter-pending" onclick="setFilter('pending')">⏳ Pending</button>
        </div>

        <div class="card" id="availableSection">
            <h2 style="margin-bottom: 20px;">🎯 Available Jobs (<span id="availableFiltered">0</span>)</h2>
            <div id="availableJobs"></div>
        </div>

        <div class="card" id="activeSection">
            <h2 style="margin-bottom: 20px;">⚡ My Active Jobs (<span id="activeFiltered">0</span>)</h2>
            <div id="activeJobs"></div>
        </div>

        <div class="card" id="pendingSection">
            <h2 style="margin-bottom: 20px;">⏳ Pending Review (<span id="pendingFiltered">0</span>)</h2>
            <div id="pendingJobs"></div>
        </div>
    </div>

    <script>
        let currentVA = null;
        let jobTimers = {};
        let currentFilter = 'all';
        let allJobsData = { available: [], active: [], pending_review: [] };

        window.addEventListener('DOMContentLoaded', () => {
            const vaData = sessionStorage.getItem('vaData');
            if (vaData) {
                currentVA = JSON.parse(vaData);
                showDashboard();
            } else {
                showLogin();
            }
        });

        function showLogin() {
            document.body.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
                    <div style="background: white; padding: 40px; border-radius: 10px; width: 400px;">
                        <h2 style="margin-bottom: 20px;">VA Login</h2>
                        <input type="email" id="loginEmail" placeholder="Email" style="margin-bottom: 10px; width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                        <input type="password" id="loginPassword" placeholder="Password" style="margin-bottom: 20px; width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
                        <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
                    </div>
                </div>
            `;
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const response = await fetch('/api/va/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await response.json();
                if (data.ok) {
                    currentVA = data.va;
                    sessionStorage.setItem('vaData', JSON.stringify(currentVA));
                    location.reload();
                } else {
                    alert('Login failed: ' + (data.error || 'Invalid credentials'));
                }
            } catch (error) {
                alert('Connection error');
            }
        }

        function showDashboard() {
            document.getElementById('vaInfo').innerHTML = `<strong>${currentVA.name}</strong><br><span style="font-size: 12px; color: #718096;">${currentVA.email}</span>`;
            document.getElementById('totalEarned').textContent = '$' + parseFloat(currentVA.total_earned || 0).toFixed(2);
            loadJobs();
            setInterval(loadJobs, 30000);
        }

        async function loadJobs() {
            try {
                const response = await fetch('/api/va/jobs', {
                    headers: {'X-VA-Email': currentVA.email}
                });
                const data = await response.json();
                if (data.ok) {
                    allJobsData = {
                        available: data.available || [],
                        active: data.active || [],
                        pending_review: data.pending_review || []
                    };
                    
                    document.getElementById('availableCount').textContent = allJobsData.available.length;
                    document.getElementById('activeCount').textContent = allJobsData.active.length;
                    document.getElementById('pendingCount').textContent = allJobsData.pending_review.length;
                    
                    applySearchAndFilter();
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('[id^="filter-"]').forEach(btn => btn.className = 'btn btn-secondary');
            document.getElementById(`filter-${filter}`).className = 'btn btn-primary';
            
            const sections = {
                'available': document.getElementById('availableSection'),
                'active': document.getElementById('activeSection'),
                'pending': document.getElementById('pendingSection')
            };
            
            if (filter === 'all') {
                Object.values(sections).forEach(s => s.classList.remove('hidden'));
            } else {
                Object.entries(sections).forEach(([key, section]) => {
                    section.classList.toggle('hidden', key !== filter);
                });
            }
        }

        function applySearchAndFilter() {
            const searchTerm = document.getElementById('jobSearchInput').value.toLowerCase().trim();
            
            const filterJobs = (jobs) => {
                if (!searchTerm) return jobs;
                return jobs.filter(job => {
                    const parcelMatch = job.parcel && job.parcel.toLowerCase().includes(searchTerm);
                    const addressMatch = job.property_address && job.property_address.toLowerCase().includes(searchTerm);
                    const serviceMatch = formatServiceType(job.service_type).toLowerCase().includes(searchTerm);
                    return parcelMatch || addressMatch || serviceMatch;
                });
            };
            
            const filteredAvailable = filterJobs(allJobsData.available);
            const filteredActive = filterJobs(allJobsData.active);
            const filteredPending = filterJobs(allJobsData.pending_review);
            
            document.getElementById('availableFiltered').textContent = filteredAvailable.length;
            document.getElementById('activeFiltered').textContent = filteredActive.length;
            document.getElementById('pendingFiltered').textContent = filteredPending.length;
            
            renderAvailableJobs(filteredAvailable);
            renderActiveJobs(filteredActive);
            renderPendingJobs(filteredPending);
        }

        function renderAvailableJobs(jobs) {
            const container = document.getElementById('availableJobs');
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No jobs match your search.</p>';
                return;
            }
            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <strong>${formatServiceType(job.service_type)}</strong><br>
                            <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 20px; font-weight: 700; color: #48bb78;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                            <button class="btn btn-success" onclick="claimJob(${job.id})">🎯 Claim</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderActiveJobs(jobs) {
            const container = document.getElementById('activeJobs');
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No active jobs match your search.</p>';
                return;
            }
            container.innerHTML = jobs.map(job => {
                const timerId = `timer-${job.id}`;
                if (!jobTimers[job.id] && job.timer_started_at) {
                    startTimer(job.id, job.timer_started_at);
                }
                return `
                    <div class="job-card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                            <div>
                                <strong>${formatServiceType(job.service_type)}</strong>
                                <span class="timer-badge" id="${timerId}">⏱️ 0:00:00</span><br>
                                <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span>
                            </div>
                            <div style="font-size: 20px; font-weight: 700; color: #48bb78;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                        </div>
                        
                        <div style="background: #fff; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 2px dashed #e2e8f0;">
                            <strong style="color: #667eea;">📎 Upload Proof</strong>
                            <input type="file" id="file-${job.id}" accept="image/*,audio/*,video/*,.pdf" 
                                   style="display: block; margin: 10px 0; width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 6px;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <button class="btn btn-primary" onclick="uploadFile(${job.id})">📤 Upload</button>
                                <span id="upload-status-${job.id}" style="color: #718096; font-size: 13px;"></span>
                            </div>
                            <div id="files-list-${job.id}" style="margin-top: 10px;"></div>
                        </div>

                        <input type="text" placeholder="Phone" id="phone-${job.id}">
                        <input type="email" placeholder="Email" id="email-${job.id}">
                        <textarea placeholder="Notes" id="notes-${job.id}" rows="3"></textarea>
                        <button class="btn btn-primary" onclick="submitJob(${job.id})">✅ Submit</button>
                    </div>
                `;
            }).join('');
            jobs.forEach(job => loadJobFiles(job.id));
        }

        function renderPendingJobs(jobs) {
            const container = document.getElementById('pendingJobs');
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No pending jobs match your search.</p>';
                return;
            }
            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <strong>${formatServiceType(job.service_type)}</strong><br>
                            <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span>
                            ${job.total_time_seconds ? `<br><span style="font-size: 13px; color: #48bb78;">⏱️ ${formatTime(job.total_time_seconds)}</span>` : ''}
                        </div>
                        <div>
                            <div style="font-size: 20px; font-weight: 700; color: #f59e0b;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                            <div style="font-size: 12px; color: #718096;">Awaiting approval</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function startTimer(jobId, startedAt) {
            const timerId = `timer-${jobId}`;
            const startTime = new Date(startedAt + 'Z');
            jobTimers[jobId] = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - startTime) / 1000);
                const element = document.getElementById(timerId);
                if (element) {
                    element.textContent = '⏱️ ' + formatTime(elapsed);
                } else {
                    clearInterval(jobTimers[jobId]);
                    delete jobTimers[jobId];
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function uploadFile(jobId) {
            const fileInput = document.getElementById(`file-${jobId}`);
            const statusEl = document.getElementById(`upload-status-${jobId}`);
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Select a file');
                return;
            }
            const file = fileInput.files[0];
            if (file.size > 50 * 1024 * 1024) {
                alert('File too large (max 50MB)');
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            statusEl.textContent = 'Uploading...';
            try {
                const response = await fetch(`/api/va/jobs/${jobId}/upload`, {
                    method: 'POST',
                    headers: {'X-VA-Email': currentVA.email},
                    body: formData
                });
                const data = await response.json();
                if (data.ok) {
                    statusEl.textContent = '✅ Uploaded!';
                    statusEl.style.color = '#48bb78';
                    fileInput.value = '';
                    setTimeout(() => statusEl.textContent = '', 3000);
                    await loadJobFiles(jobId);
                } else {
                    alert('Upload failed');
                    statusEl.textContent = '';
                }
            } catch (error) {
                alert('Upload error');
                statusEl.textContent = '';
            }
        }

        async function loadJobFiles(jobId) {
            try {
                const response = await fetch(`/api/va/jobs/${jobId}/files`);
                const data = await response.json();
                const container = document.getElementById(`files-list-${jobId}`);
                if (!container) return;
                if (!data.ok || data.files.length === 0) {
                    container.innerHTML = '<div style="color: #718096; font-size: 13px; margin-top: 5px;">No files</div>';
                    return;
                }
                container.innerHTML = '<div style="font-weight: 600; margin-top: 10px; font-size: 13px;">Uploaded:</div>' +
                    data.files.map(f => `
                        <div style="display: flex; justify-content: space-between; padding: 8px; background: white; border-radius: 4px; margin: 5px 0; font-size: 13px;">
                            <div>📎 ${f.original_filename} <span style="color: #718096;">(${formatFileSize(f.file_size)})</span></div>
                            <button onclick="deleteFile(${jobId}, ${f.id})" style="background: none; border: none; cursor: pointer; color: #f56565;">🗑️</button>
                        </div>
                    `).join('');
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        async function deleteFile(jobId, fileId) {
            if (!confirm('Delete?')) return;
            try {
                await fetch(`/api/va/jobs/${jobId}/files/${fileId}`, {
                    method: 'DELETE',
                    headers: {'X-VA-Email': currentVA.email}
                });
                await loadJobFiles(jobId);
            } catch (error) {
                alert('Delete failed');
            }
        }

        async function claimJob(jobId) {
            try {
                const response = await fetch(`/api/va/jobs/${jobId}/claim`, {
                    method: 'POST',
                    headers: {'X-VA-Email': currentVA.email}
                });
                const data = await response.json();
                if (data.ok) {
                    alert('✅ Job claimed!');
                    loadJobs();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Error');
            }
        }

        async function submitJob(jobId) {
            const phone = document.getElementById(`phone-${jobId}`).value;
            const email = document.getElementById(`email-${jobId}`).value;
            const notes = document.getElementById(`notes-${jobId}`).value;
            if (!phone && !email) {
                alert('Provide phone or email');
                return;
            }
            try {
                const response = await fetch(`/api/va/jobs/${jobId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-VA-Email': currentVA.email
                    },
                    body: JSON.stringify({phone, email, notes})
                });
                const data = await response.json();
                if (data.ok) {
                    alert('✅ Submitted!');
                    if (jobTimers[jobId]) {
                        clearInterval(jobTimers[jobId]);
                        delete jobTimers[jobId];
                    }
                    loadJobs();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                alert('❌ Error');
            }
        }

        function formatServiceType(type) {
            const types = {
                'skiptrace': '🔍 Skip Trace',
                'cold_call_block': '📞 Cold Call',
                'postcard': '📮 Postcard',
                'door_knock': '🚪 Door Knock',
                'test_service': '🧪 Test'
            };
            return types[type] || type;
        }

        function logout() {
            sessionStorage.removeItem('vaData');
            location.reload();
        }
    </script>
</body>
</html>
