<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA Portal - Service Requests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .timer-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #48bb78;
            color: white;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .job-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f7fafc;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>💼 VA Portal</h1>
                <div id="vaInfo"></div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <!-- Stats -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #667eea;" id="availableCount">0</div>
                <div style="color: #718096;">Available Jobs</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #48bb78;" id="activeCount">0</div>
                <div style="color: #718096;">Active Jobs</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #f59e0b;" id="pendingCount">0</div>
                <div style="color: #718096;">Pending Review</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #2d3748;" id="totalEarned">$0</div>
                <div style="color: #718096;">Total Earned</div>
            </div>
        </div>

        <!-- Available Jobs -->
        <div class="card">
            <h2 style="margin-bottom: 20px;">🎯 Available Jobs (Queue)</h2>
            <div id="availableJobs"></div>
        </div>

        <!-- Active Jobs -->
        <div class="card">
            <h2 style="margin-bottom: 20px;">⚡ My Active Jobs</h2>
            <div id="activeJobs"></div>
        </div>

        <!-- Pending Review -->
        <div class="card">
            <h2 style="margin-bottom: 20px;">⏳ Pending Admin Review</h2>
            <div id="pendingJobs"></div>
        </div>
    </div>

    <script>
        let currentVA = null;
        let jobTimers = {};

        window.addEventListener('DOMContentLoaded', () => {
            const vaData = sessionStorage.getItem('vaData');
            if (vaData) {
                currentVA = JSON.parse(vaData);
                showDashboard();
            } else {
                showLogin();
            }
        });

        function showLogin() {
            document.body.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
                    <div style="background: white; padding: 40px; border-radius: 10px; width: 400px;">
                        <h2 style="margin-bottom: 20px;">VA Login</h2>
                        <input type="email" id="loginEmail" placeholder="Email" style="margin-bottom: 10px;">
                        <input type="password" id="loginPassword" placeholder="Password" style="margin-bottom: 20px;">
                        <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
                    </div>
                </div>
            `;
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/va/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });

                const data = await response.json();

                if (data.ok) {
                    currentVA = data.va;
                    sessionStorage.setItem('vaData', JSON.stringify(currentVA));
                    location.reload();
                } else {
                    alert('Login failed: ' + (data.error || 'Invalid credentials'));
                }
            } catch (error) {
                alert('Connection error');
            }
        }

        function showDashboard() {
            document.getElementById('vaInfo').innerHTML = `
                <strong>${currentVA.name}</strong><br>
                <span style="font-size: 12px; color: #718096;">${currentVA.email}</span>
            `;
            document.getElementById('totalEarned').textContent = '$' + parseFloat(currentVA.total_earned || 0).toFixed(2);
            loadJobs();
            setInterval(loadJobs, 30000); // Refresh every 30 seconds
        }

        async function loadJobs() {
            try {
                const response = await fetch('/api/va/jobs', {
                    headers: {'X-VA-Email': currentVA.email}
                });

                const data = await response.json();

                if (data.ok) {
                    document.getElementById('availableCount').textContent = data.available.length;
                    document.getElementById('activeCount').textContent = data.active.length;
                    document.getElementById('pendingCount').textContent = data.pending_review.length;

                    renderAvailableJobs(data.available);
                    renderActiveJobs(data.active);
                    renderPendingJobs(data.pending_review);
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
            }
        }

        function renderAvailableJobs(jobs) {
            const container = document.getElementById('availableJobs');
            
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No jobs available right now. Check back soon!</p>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div>
                            <strong>${formatServiceType(job.service_type)}</strong><br>
                            <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 20px; font-weight: 700; color: #48bb78;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                            <button class="btn btn-success" onclick="claimJob(${job.id})">🎯 Claim This Job</button>
                        </div>
                    </div>
                    <div style="font-size: 13px; color: #718096;">
                        Posted: ${new Date(job.created_at).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }

        function renderActiveJobs(jobs) {
            const container = document.getElementById('activeJobs');
            
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No active jobs. Claim a job from the queue above!</p>';
                return;
            }

            container.innerHTML = jobs.map(job => {
                const timerId = `timer-${job.id}`;
                
                // Start timer for this job
                if (!jobTimers[job.id] && job.timer_started_at) {
                    startTimer(job.id, job.timer_started_at);
                }

                return `
                    <div class="job-card">
                        <div class="job-header">
                            <div>
                                <strong>${formatServiceType(job.service_type)}</strong>
                                <span class="timer-badge" id="${timerId}">⏱️ 0:00:00</span>
                                <br>
                                <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span><br>
                                <span style="font-size: 14px; color: #718096;">Address: ${job.property_address || 'N/A'}</span>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 20px; font-weight: 700; color: #48bb78;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <input type="text" placeholder="Phone Number" id="phone-${job.id}" style="margin-bottom: 10px;">
                            <input type="email" placeholder="Email Address" id="email-${job.id}" style="margin-bottom: 10px;">
                            <textarea placeholder="Notes (optional)" id="notes-${job.id}" rows="3"></textarea>
                            <button class="btn btn-primary" style="margin-top: 10px;" onclick="submitJob(${job.id})">
                                ✅ Submit Results
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPendingJobs(jobs) {
            const container = document.getElementById('pendingJobs');
            
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096;">No jobs pending review.</p>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div>
                            <strong>${formatServiceType(job.service_type)}</strong><br>
                            <span style="font-size: 14px; color: #718096;">Parcel: ${job.parcel}</span><br>
                            ${job.total_time_seconds ? `<span style="font-size: 13px; color: #48bb78;">⏱️ Time worked: ${formatTime(job.total_time_seconds)}</span>` : ''}
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 20px; font-weight: 700; color: #f59e0b;">$${parseFloat(job.va_payout).toFixed(2)}</div>
                            <div style="font-size: 12px; color: #718096;">Awaiting approval</div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; padding: 10px; background: #fff5e6; border-radius: 6px;">
                        ${job.phone ? `<div>📞 ${job.phone}</div>` : ''}
                        ${job.email ? `<div>📧 ${job.email}</div>` : ''}
                        ${job.notes ? `<div style="margin-top: 5px;">${job.notes}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function startTimer(jobId, startedAt) {
            const timerId = `timer-${jobId}`;
            const startTime = new Date(startedAt + 'Z'); // Add Z for UTC
            
            jobTimers[jobId] = setInterval(() => {
                const now = new Date();
                const elapsed = Math.floor((now - startTime) / 1000);
                
                const element = document.getElementById(timerId);
                if (element) {
                    element.textContent = '⏱️ ' + formatTime(elapsed);
                } else {
                    clearInterval(jobTimers[jobId]);
                    delete jobTimers[jobId];
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function claimJob(jobId) {
            try {
                const response = await fetch(`/api/va/jobs/${jobId}/claim`, {
                    method: 'POST',
                    headers: {'X-VA-Email': currentVA.email}
                });

                const data = await response.json();

                if (data.ok) {
                    alert('✅ Job claimed! Timer started.');
                    loadJobs();
                } else {
                    alert('❌ ' + (data.error || 'Failed to claim job'));
                }
            } catch (error) {
                alert('❌ Connection error');
            }
        }

        async function submitJob(jobId) {
            const phone = document.getElementById(`phone-${jobId}`).value;
            const email = document.getElementById(`email-${jobId}`).value;
            const notes = document.getElementById(`notes-${jobId}`).value;

            if (!phone && !email) {
                alert('Please provide at least phone or email');
                return;
            }

            try {
                const response = await fetch(`/api/va/jobs/${jobId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-VA-Email': currentVA.email
                    },
                    body: JSON.stringify({phone, email, notes})
                });

                const data = await response.json();

                if (data.ok) {
                    alert('✅ Results submitted for review!');
                    
                    // Stop timer
                    if (jobTimers[jobId]) {
                        clearInterval(jobTimers[jobId]);
                        delete jobTimers[jobId];
                    }
                    
                    loadJobs();
                } else {
                    alert('❌ ' + (data.error || 'Failed to submit'));
                }
            } catch (error) {
                alert('❌ Connection error');
            }
        }

        function formatServiceType(type) {
            const types = {
                'skiptrace': '🔍 Contact Research',
                'cold_call_block': '📞 Cold Calling',
                'postcard': '📮 Direct Mail',
                'door_knock': '🚪 Door Knock'
            };
            return types[type] || type;
        }

        function logout() {
            sessionStorage.removeItem('vaData');
            location.reload();
        }
    </script>
</body>
</html>
