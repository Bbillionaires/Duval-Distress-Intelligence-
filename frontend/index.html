<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Duval Distress Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #050816;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px 48px;
      box-sizing: border-box;
    }
    .card {
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.55);
      border: 1px solid rgba(148,163,184,0.2);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #f9fafb;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34,197,94,0.5);
    }
    .hint {
      font-size: 0.7rem;
      color: #6b7280;
      margin-top: 4px;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      border-radius: 999px;
      padding: 10px 14px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(to right, #22c55e, #22c55e);
      color: #022c22;
    }
    .btn-secondary {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .status {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #9ca3af;
      min-height: 1.2em;
    }
    .results-card {
      margin-top: 16px;
      padding: 14px 12px;
      border-radius: 14px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(55,65,81,0.9);
      font-size: 0.85rem;
    }
    .results-card h2 {
      margin: 0 0 6px;
      font-size: 0.95rem;
    }
    .results-metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .results-row {
      margin-top: 4px;
    }
    .label-small {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 2px;
    }
    .value-big {
      font-size: 1.2rem;
      font-weight: 700;
      color: #22c55e;
    }
    .no-results {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #ef4444;
    }
    .footer {
      margin-top: 18px;
      font-size: 0.7rem;
      color: #6b7280;
      text-align: center;
    }
    a {
      color: #22c55e;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Duval Distress Intelligence</h1>
      <div class="subtitle">
        Quick parcel distress scan — powered by Duval public tax data.
      </div>

      <label for="parcel-input">Parcel / Account Number</label>
      <input id="parcel-input" placeholder="e.g. 030147-0432 or 086286-0000" />
      <div class="hint">Use Duval parcel format: 6 digits, dash, 4 digits.</div>

      <div class="actions">
        <button class="btn-primary" onclick="searchParcel()">Search Parcel</button>
        <button class="btn-secondary" onclick="quickTest()">Test Sample</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </div>

    <div class="footer">
      API: <code>https://duval-distress-intelligence.onrender.com/api/parcel?parcel=...</code>
    </div>
  </div>

  <script>
    const API_BASE = "https://duval-distress-intelligence.onrender.com";

    async function searchParcel() {
      const parcelEl = document.getElementById("parcel-input");
      const parcel = parcelEl.value.trim();
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");

      if (!parcel) {
        statusEl.textContent = "Please enter a parcel number first.";
        return;
      }

      statusEl.textContent = "Searching...";
      resultsEl.innerHTML = "";

      try {
        const res = await fetch(
          API_BASE + "/api/parcel?parcel=" + encodeURIComponent(parcel)
        );
        const data = await res.json();

        if (!data || data.status !== "success") {
          statusEl.textContent = "API error. Check backend.";
          return;
        }

        statusEl.textContent = `Source: ${data.source || "unknown"} · Count: ${data.count}`;

        if (!data.rows || !data.rows.length) {
          resultsEl.innerHTML = '<div class="no-results">No results found for that parcel.</div>';
          return;
        }

        const row = data.rows[0];
        const total = row.total_due || "";
        const totalFormatted = total ? "$" + Number(total).toLocaleString() : "N/A";

        const owner = row.owner_name || row.display_name || "N/A";
        const address = [
          row.address || "",
          row.city || "",
          row.state || "",
          row.zip || "",
        ].filter(Boolean).join(", ");

        const created = row.created_at
          ? new Date(row.created_at).toLocaleString()
          : "";

        resultsEl.innerHTML = `
          <div class="results-card">
            <h2>${owner}</h2>
            <div class="results-metadata">
              <span><strong>Parcel:</strong> ${row.parcel || ""}</span>
              ${address ? `<span><strong>Address:</strong> ${address}</span>` : ""}
              ${created ? `<span><strong>Captured:</strong> ${created}</span>` : ""}
            </div>
            <div class="results-row">
              <div class="label-small">Total Amount Due</div>
              <div class="value-big">${totalFormatted}</div>
            </div>
          </div>
        `;
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Network error talking to backend.";
      }
    }

    function quickTest() {
      const input = document.getElementById("parcel-input");
      input.value = "030147-0432"; // Lorenzo test
      searchParcel();
    }
  </script>
</body>
</html>
