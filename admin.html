<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin - Distress Intelligence</title>
  <style>
    body{font-family:Arial;margin:20px;max-width:1100px}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
    button{padding:10px 12px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#444}
    pre{background:#0b1020;color:#e5e7eb;padding:12px;border-radius:12px;overflow:auto}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  </style>
</head>
<body>
  <div class="top">
    <h2>Admin</h2>
    <div class="row">
      <button class="secondary" onclick="location.href='/'">Home</button>
      <button class="secondary" onclick="location.href='/login'">Login</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button onclick="health()">Health</button>
      <button onclick="rebuild()">Rebuild CSV</button>
      <button onclick="openTrue()">Open TRUE Leads</button>
    </div>
    <pre id="out">Ready.</pre>
  </div>

<script>
async function health(){
  const res = await fetch("/api/health");
  document.getElementById("out").textContent = await res.text();
}
async function rebuild(){
  const res = await fetch("/api/rebuild_delinquent", {method:"POST"});
  document.getElementById("out").textContent = await res.text();
}
function openTrue(){
  window.open("/?still_delinquent=true", "_blank");
}
async function logout(){
  const res = await fetch("/api/logout", {method:"POST"});
  location.href="/login";
}
</script>
</body>
</html>
