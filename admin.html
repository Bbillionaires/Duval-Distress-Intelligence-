<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1800px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #f56565; color: white; }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f7fafc;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
        }
        .note-card {
            border: 1px solid #e2e8f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            background: #f7fafc;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            color: #718096;
            font-size: 12px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🏘️ Admin Dashboard</h1>
                <div style="color: #718096; font-size: 14px;">Property Management</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="window.location.href='/pricing'">💰 Pricing</button>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #667eea;" id="totalProperties">0</div>
                <div style="color: #718096;">Total Properties</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #48bb78;" id="sweetSpot">0</div>
                <div style="color: #718096;">Sweet Spot</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #f56565;" id="dangerZone">0</div>
                <div style="color: #718096;">Danger Zone</div>
            </div>
            <div class="card" style="text-align: center;">
                <div style="font-size: 32px; font-weight: 700; color: #2d3748;" id="totalDue">$0</div>
                <div style="color: #718096;">Total Due</div>
            </div>
        </div>

        <!-- VA Jobs Pending Approval -->
        <div class="card">
            <h2 style="margin-bottom: 20px;">✅ VA Jobs - Pending Approval</h2>
            <div id="pendingJobsTable"></div>
        </div>

        <!-- Properties -->
        <div class="card">
            <h2 style="margin-bottom: 20px;">📊 Properties</h2>
            <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="🔍 Search by address, parcel, zip, or owner..." 
                       style="flex: 1; min-width: 300px; padding: 8px 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px;">
                <select id="stageFilter" style="padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <option value="">All Stages</option>
                    <option value="sweet_spot">Sweet Spot</option>
                    <option value="danger_zone">Danger Zone</option>
                    <option value="pre_lien">Pre-Lien</option>
                </select>
                <button class="btn btn-primary" onclick="loadProperties()">🔍 Search</button>
            </div>
            <div id="propertiesTable"></div>
            <div id="pagination" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;"></div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">📝 Notes for <span id="notesParcel"></span></h2>
            
            <div style="margin-bottom: 20px;">
                <textarea id="newNote" placeholder="Add a note..." rows="3" style="margin-bottom: 10px;"></textarea>
                <button class="btn btn-primary" onclick="addNote()">💾 Save Note</button>
            </div>

            <div id="notesList"></div>

            <div style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeNotesModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentPropertyId = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadProperties();
            loadPendingJobs();
            setInterval(loadPendingJobs, 60000); // Refresh every minute
        });

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                if (data.ok) {
                    document.getElementById('totalProperties').textContent = (data.overall.total_properties || 0).toLocaleString();
                    document.getElementById('sweetSpot').textContent = (data.overall.sweet_spot_count || 0).toLocaleString();
                    const dangerZone = data.by_stage.find(s => s.stage === 'danger_zone');
                    document.getElementById('dangerZone').textContent = (dangerZone?.count || 0).toLocaleString();
                    const totalDue = parseFloat(data.overall.total_amount_due || 0);
                    document.getElementById('totalDue').textContent = '$' + (totalDue / 1000000).toFixed(1) + 'M';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadPendingJobs() {
            try {
                const response = await fetch('/api/admin/service-requests?status=submitted');
                const data = await response.json();
                renderPendingJobs(data.requests || []);
            } catch (error) {
                console.error('Error loading pending jobs:', error);
            }
        }

        function renderPendingJobs(jobs) {
            const container = document.getElementById('pendingJobsTable');
            
            if (jobs.length === 0) {
                container.innerHTML = '<p style="color: #718096; text-align: center; padding: 20px;">No jobs pending approval</p>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>VA</th>
                            <th>Service</th>
                            <th>Parcel</th>
                            <th>Results</th>
                            <th>Time</th>
                            <th>Payout</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${jobs.map(job => `
                            <tr>
                                <td>${job.claimed_by_va_email}</td>
                                <td>${formatServiceType(job.service_type)}</td>
                                <td><strong>${job.parcel}</strong></td>
                                <td>
                                    ${job.phone ? `📞 ${job.phone}<br>` : ''}
                                    ${job.email ? `📧 ${job.email}<br>` : ''}
                                    ${job.notes ? `<small>${job.notes}</small>` : ''}
                                </td>
                                <td>${job.total_time_seconds ? formatTime(job.total_time_seconds) : '-'}</td>
                                <td><strong>$${parseFloat(job.va_payout).toFixed(2)}</strong></td>
                                <td>
                                    <button class="btn btn-success btn-sm" onclick="approveJob(${job.id})">✅ Approve</button>
                                    <button class="btn btn-danger btn-sm" onclick="rejectJob(${job.id})">❌ Reject</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function approveJob(jobId) {
            if (!confirm('Approve this job and pay the VA?')) return;
            
            try {
                const response = await fetch(`/api/admin/service-requests/${jobId}/approve`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    alert('✅ Job approved! VA will be paid.');
                    loadPendingJobs();
                } else {
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error approving job');
            }
        }

        async function rejectJob(jobId) {
            const reason = prompt('Why are you rejecting this job?');
            if (!reason) return;
            
            try {
                const response = await fetch(`/api/admin/service-requests/${jobId}/reject`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reason})
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    alert('❌ Job rejected and returned to VA');
                    loadPendingJobs();
                } else {
                    alert('Failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error rejecting job');
            }
        }

        async function loadProperties() {
            const stage = document.getElementById('stageFilter').value;
            const search = document.getElementById('searchInput').value.trim();
            const params = new URLSearchParams({ page: currentPage, page_size: 10 });
            if (stage) params.append('stage', stage);
            if (search) params.append('search', search);

            try {
                const response = await fetch(`/api/properties?${params}`);
                const data = await response.json();
                
                if (data.ok && data.rows.length > 0) {
                    renderProperties(data.rows);
                    renderPagination(data.total);
                }
            } catch (error) {
                console.error('Error loading properties:', error);
            }
        }

        function renderProperties(properties) {
            const container = document.getElementById('propertiesTable');
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Parcel</th>
                            <th>Stage</th>
                            <th>Address</th>
                            <th>Owner</th>
                            <th>Amount Due</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${properties.map(prop => `
                            <tr>
                                <td><strong>${prop.parcel}</strong></td>
                                <td><span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; background: ${getStageColor(prop.stage)}; color: white;">${formatStage(prop.stage)}</span></td>
                                <td>${prop.address || '-'}</td>
                                <td>${prop.owner || '-'}</td>
                                <td><strong>$${parseFloat(prop.current_total_due || 0).toLocaleString()}</strong></td>
                                <td>
                                    <button class="btn btn-primary btn-sm" onclick="openNotesModal(${prop.id}, '${prop.parcel}')">
                                        📝 Notes
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / 10);
            const container = document.getElementById('pagination');
            let html = '';
            
            if (currentPage > 1) {
                html += `<button class="btn btn-secondary" onclick="changePage(${currentPage - 1})">← Previous</button>`;
            }
            
            html += `<span style="padding: 10px;">Page ${currentPage} of ${totalPages}</span>`;
            
            if (currentPage < totalPages) {
                html += `<button class="btn btn-secondary" onclick="changePage(${currentPage + 1})">Next →</button>`;
            }
            
            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadProperties();
        }

        function getStageColor(stage) {
            const colors = {
                'sweet_spot': '#48bb78',
                'danger_zone': '#f56565',
                'pre_lien': '#ecc94b',
                'unpaid_new': '#9f7aea',
                'tax_deed_filed': '#ed8936'
            };
            return colors[stage] || '#718096';
        }

        function formatStage(stage) {
            const stages = {
                'sweet_spot': 'Sweet Spot',
                'danger_zone': 'Danger Zone',
                'pre_lien': 'Pre-Lien',
                'unpaid_new': 'Unpaid New',
                'tax_deed_filed': 'Tax Deed Filed'
            };
            return stages[stage] || stage;
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }

        function formatServiceType(type) {
            const types = {
                'skiptrace': '🔍 Skip Trace',
                'cold_call_block': '📞 Cold Call',
                'postcard': '📮 Postcard',
                'door_knock': '🚪 Door Knock',
                'test_service': '🧪 Test'
            };
            return types[type] || type;
        }

        // Notes Functions
        async function openNotesModal(propertyId, parcel) {
            currentPropertyId = propertyId;
            document.getElementById('notesParcel').textContent = parcel;
            document.getElementById('notesModal').style.display = 'flex';
            await loadNotes();
        }

        function closeNotesModal() {
            document.getElementById('notesModal').style.display = 'none';
            currentPropertyId = null;
            document.getElementById('newNote').value = '';
        }

        async function loadNotes() {
            if (!currentPropertyId) return;
            
            try {
                const response = await fetch(`/api/properties/${currentPropertyId}/notes`);
                const data = await response.json();
                
                const container = document.getElementById('notesList');
                
                if (!data.ok || data.notes.length === 0) {
                    container.innerHTML = '<p style="color: #718096; text-align: center; padding: 20px;">No notes yet</p>';
                    return;
                }
                
                container.innerHTML = data.notes.map(note => `
                    <div class="note-card">
                        <div class="note-header">
                            <span>${new Date(note.created_at).toLocaleString()} - ${note.user_email}</span>
                            <button onclick="deleteNote(${note.id})" style="background: none; border: none; cursor: pointer; color: #f56565;">🗑️</button>
                        </div>
                        <div style="color: #2d3748;">${note.note}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        async function addNote() {
            const noteText = document.getElementById('newNote').value.trim();
            if (!noteText) {
                alert('Please enter a note');
                return;
            }
            
            try {
                const response = await fetch(`/api/properties/${currentPropertyId}/notes`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({note: noteText})
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    document.getElementById('newNote').value = '';
                    await loadNotes();
                } else {
                    alert('Failed to add note: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error adding note');
            }
        }

        async function deleteNote(noteId) {
            if (!confirm('Delete this note?')) return;
            
            try {
                const response = await fetch(`/api/properties/${currentPropertyId}/notes/${noteId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadNotes();
                } else {
                    alert('Failed to delete note');
                }
            } catch (error) {
                alert('Error deleting note');
            }
        }

        function logout() {
            if (confirm('Log out?')) {
                window.location.href = '/logout';
            }
        }
    </script>
</body>
</html>
