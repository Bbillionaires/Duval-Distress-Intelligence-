<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f7fafc;
            color: #2d3748;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #718096;
        }

        select, input {
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f7fafc;
        }

        th {
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #718096;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f7fafc;
        }

        .pagination {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .pagination button {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        .notes-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .note-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #718096;
        }

        .note-text {
            color: #2d3748;
            line-height: 1.6;
        }

        .files-list {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f7fafc;
            border-radius: 6px;
            font-size: 14px;
        }

        .file-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-icon {
            width: 36px;
            height: 36px;
            background: #667eea;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 11px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #f56565;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>⚡ Admin Dashboard</h1>
            <nav class="nav-links">
                <a href="admin.html">Properties</a>
                <a href="admin_listing_manager.html">Listings</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <div id="alertContainer"></div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label class="filter-label">Category</label>
                <select id="categoryFilter" onchange="loadProperties(1)">
                    <option value="">All Categories</option>
                    <option value="Tax Lien Delinquent">Tax Lien Delinquent</option>
                    <option value="Tax Deed">Tax Deed</option>
                    <option value="Code Violations">Code Violations</option>
                    <option value="Foreclosure">Foreclosure</option>
                    <option value="Pre-Foreclosure">Pre-Foreclosure</option>
                    <option value="Vacant">Vacant</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Search</label>
                <input type="text" id="searchInput" placeholder="Address, parcel, owner..." onkeyup="handleSearch()">
            </div>
            <div class="filter-group">
                <button class="btn btn-primary" onclick="loadProperties(1)">Apply Filters</button>
            </div>
        </div>

        <!-- Properties Card -->
        <div class="card">
            <!-- Top Pagination -->
            <div class="pagination" id="paginationTop"></div>

            <!-- Properties Table -->
            <div id="propertiesLoading" class="loading">
                <div class="spinner"></div>
                <div>Loading properties...</div>
            </div>
            <div id="propertiesContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Parcel</th>
                            <th>Owner</th>
                            <th>Category</th>
                            <th>Amount Due</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="propertiesBody"></tbody>
                </table>
            </div>

            <!-- Bottom Pagination -->
            <div class="pagination" id="paginationBottom"></div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="notesModalTitle">Property Notes</h2>
                <button class="btn btn-secondary btn-small" onclick="closeNotesModal()">Close</button>
            </div>
            
            <div class="form-group">
                <label>Add New Note</label>
                <textarea id="newNoteText" placeholder="Enter note..."></textarea>
                <button class="btn btn-success" onclick="saveNote()" style="margin-top: 10px;">Save Note</button>
            </div>

            <div class="notes-list" id="notesList"></div>
        </div>
    </div>

    <!-- Files Modal -->
    <div id="filesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Service Request Files</h2>
                <button class="btn btn-secondary btn-small" onclick="closeFilesModal()">Close</button>
            </div>
            
            <div id="filesLoading" class="loading">
                <div class="spinner"></div>
                Loading files...
            </div>
            <div id="filesContainer" class="files-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://real-estate-intel.onrender.com';
        

        let currentPage = 1;
        let totalPages = 1;
        let searchTimeout = null;
        let currentPropertyId = null;
        let currentServiceRequestId = null;
        const pageSize = 20;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProperties(1);
        });

        // Load properties with pagination
        async function loadProperties(page = 1) {
            currentPage = page;
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchInput').value;

            document.getElementById('propertiesLoading').style.display = 'block';
            document.getElementById('propertiesContainer').style.display = 'none';

            const offset = (page - 1) * pageSize;

            try {
                let url = `${API_BASE}/api/admin/properties?limit=${pageSize}&offset=${offset}`;
                if (category) url += `&category=${encodeURIComponent(category)}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;

                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('propertiesLoading').style.display = 'none';
                document.getElementById('propertiesContainer').style.display = 'block';

                if (data.ok && data.properties) {
                    totalPages = Math.ceil(data.total / pageSize) || 1;

                    const tbody = document.getElementById('propertiesBody');
                    tbody.innerHTML = '';

                    if (data.properties.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No properties found</td></tr>';
                    } else {
                        data.properties.forEach(prop => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${prop.address || 'N/A'}</td>
                                    <td>${prop.parcel || 'N/A'}</td>
                                    <td>${prop.owner || 'N/A'}</td>
                                    <td><span style="background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${prop.category || 'N/A'}</span></td>
                                    <td>$${parseFloat(prop.current_total_due || 0).toFixed(2)}</td>
                                    <td>
                                        <button class="btn btn-primary btn-small" onclick="openNotesModal(${prop.id}, '${(prop.address || prop.parcel || '').replace(/'/g, "\\'")}')">Notes</button>
                                        <button class="btn btn-secondary btn-small" onclick="viewFiles(${prop.id})">Files</button>
                                    </td>
                                </tr>
                            `;
                        });
                    }

                    updatePagination();
                }
            } catch (err) {
                document.getElementById('propertiesLoading').style.display = 'none';
                showAlert('error', 'Error loading properties: ' + err.message);
            }
        }

        // Update pagination
        function updatePagination() {
            const html = `
                <button onclick="loadProperties(1)" ${currentPage === 1 ? 'disabled' : ''}>First</button>
                <button onclick="loadProperties(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <span style="color: #718096;">Page ${currentPage} of ${totalPages}</span>
                <button onclick="loadProperties(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
                <button onclick="loadProperties(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>Last</button>
            `;
            
            document.getElementById('paginationTop').innerHTML = html;
            document.getElementById('paginationBottom').innerHTML = html;
        }

        // Search with debounce
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadProperties(1);
            }, 300);
        }

        // Notes Modal Functions
        async function openNotesModal(propertyId, address) {
            currentPropertyId = propertyId;
            document.getElementById('notesModalTitle').textContent = `Notes - ${address}`;
            document.getElementById('newNoteText').value = '';
            document.getElementById('notesModal').style.display = 'block';
            
            await loadNotes(propertyId);
        }

        async function loadNotes(propertyId) {
            try {
                const res = await fetch(`${API_BASE}/api/properties/${propertyId}/notes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const notesList = document.getElementById('notesList');
                notesList.innerHTML = '';

                if (data.ok && data.notes && data.notes.length > 0) {
                    data.notes.forEach(note => {
                        notesList.innerHTML += `
                            <div class="note-item">
                                <div class="note-header">
                                    <span>${note.user_email}</span>
                                    <span>${new Date(note.created_at).toLocaleString()}</span>
                                </div>
                                <div class="note-text">${note.note}</div>
                            </div>
                        `;
                    });
                } else {
                    notesList.innerHTML = '<p style="text-align: center; color: #718096; padding: 20px;">No notes yet</p>';
                }
            } catch (err) {
                console.error('Error loading notes:', err);
            }
        }

        async function saveNote() {
            const noteText = document.getElementById('newNoteText').value.trim();
            
            if (!noteText) {
                showAlert('error', 'Please enter a note');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/properties/${currentPropertyId}/notes`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ note: noteText })
                });

                const data = await res.json();

                if (data.ok) {
                    showAlert('success', '✅ Note saved successfully');
                    document.getElementById('newNoteText').value = '';
                    await loadNotes(currentPropertyId);
                } else {
                    showAlert('error', data.error || 'Failed to save note');
                }
            } catch (err) {
                showAlert('error', 'Error: ' + err.message);
            }
        }

        function closeNotesModal() {
            document.getElementById('notesModal').style.display = 'none';
            currentPropertyId = null;
        }

        // Files Modal Functions
        async function viewFiles(propertyId) {
            document.getElementById('filesModal').style.display = 'block';
            document.getElementById('filesLoading').style.display = 'block';
            document.getElementById('filesContainer').innerHTML = '';

            try {
                // Get all service requests for this property
                const res = await fetch(`${API_BASE}/api/admin/service-requests?property_id=${propertyId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('filesLoading').style.display = 'none';

                if (data.ok && data.requests && data.requests.length > 0) {
                    // Load files for each service request
                    for (const request of data.requests) {
                        await loadFilesForRequest(request.id);
                    }
                } else {
                    document.getElementById('filesContainer').innerHTML = '<p style="text-align: center; color: #718096; padding: 20px;">No service requests found</p>';
                }
            } catch (err) {
                document.getElementById('filesLoading').style.display = 'none';
                document.getElementById('filesContainer').innerHTML = `<p style="text-align: center; color: #f56565; padding: 20px;">Error: ${err.message}</p>`;
            }
        }

        async function loadFilesForRequest(requestId) {
            try {
                const res = await fetch(`${API_BASE}/api/va/jobs/${requestId}/files`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                const container = document.getElementById('filesContainer');

                if (data.ok && data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const ext = (file.original_filename || file.file_name || '').split('.').pop().toUpperCase();
                        container.innerHTML += `
                            <div class="file-item">
                                <div class="file-info">
                                    <div class="file-icon">${ext}</div>
                                    <div>
                                        <div style="font-weight: 500;">${file.original_filename || file.file_name}</div>
                                        <div style="font-size: 12px; color: #718096;">
                                            ${formatFileSize(file.file_size)} • ${new Date(file.uploaded_at).toLocaleDateString()}
                                        </div>
                                    </div>
                                </div>
                                <button class="btn btn-primary btn-small" onclick="window.open('${file.file_url}', '_blank')">View</button>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error('Error loading files:', err);
            }
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function closeFilesModal() {
            document.getElementById('filesModal').style.display = 'none';
        }

        // Alert system
        function showAlert(type, message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const container = document.getElementById('alertContainer');
            container.appendChild(alertDiv);

            setTimeout(() => alertDiv.remove(), 5000);
        }

        // Logout
        async function logout() {
            await fetch(`${API_BASE}/api/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
