<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Distress Intelligence · Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-auto px-4">
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-full bg-emerald-400 flex items-center justify-center font-bold text-slate-900">
          DI
        </div>
        <div>
          <h1 class="text-lg font-semibold">Distress Intelligence</h1>
          <p class="text-xs text-slate-400">Sign in to access Duval distress data</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Email</label>
          <input id="emailInput"
                 type="email"
                 placeholder="you@example.com"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Password</label>
          <input id="passwordInput"
                 type="password"
                 placeholder="••••••••"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
      </div>

      <div class="mt-4 space-y-2">
        <button id="loginBtn"
                class="w-full rounded-full bg-emerald-400 text-slate-900 text-sm font-medium py-2 hover:bg-emerald-300">
          Log In
        </button>
        <button id="signupBtn"
                class="w-full rounded-full bg-slate-800 text-slate-100 text-sm py-2 border border-slate-600 hover:bg-slate-700">
          Create New Account
        </button>
      </div>

      <p id="statusText" class="mt-3 text-xs text-slate-400 min-h-[1rem]"></p>

      <p class="mt-4 text-[11px] text-slate-500 text-center">
        By continuing you agree not to scrape, resell, or abuse this data source.
      </p>
    </div>
  </div>

  <!-- 1) Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>

  <!-- 2) Shared Firebase config + auth guard -->
  <script src="firebase.js"></script>

  <!-- 3) Page-specific login logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");
      const statusText = document.getElementById("statusText");

      async function handleLogin() {
        const email = emailInput.value.trim();
        const pass = passwordInput.value;
        if (!email || !pass) {
          statusText.textContent = "Enter email and password.";
          return;
        }
        statusText.textContent = "Signing in...";
        try {
          const app = ensureFirebaseApp();
          if (!app || !firebase.auth) {
            statusText.textContent = "Firebase not available.";
            return;
          }
          await firebase.auth().signInWithEmailAndPassword(email, pass);
          statusText.textContent = "Success. Redirecting…";
          window.location.href = "/";
        } catch (err) {
          statusText.textContent = err.message || "Login failed.";
        }
      }

      async function handleSignup() {
        const email = emailInput.value.trim();
        const pass = passwordInput.value;
        if (!email || !pass) {
          statusText.textContent = "Enter email and password.";
          return;
        }
        statusText.textContent = "Creating account...";
        try {
          const app = ensureFirebaseApp();
          if (!app || !firebase.auth) {
            statusText.textContent = "Firebase not available.";
            return;
          }
          await firebase.auth().createUserWithEmailAndPassword(email, pass);
          statusText.textContent = "Account created. Redirecting…";
          window.location.href = "/";
        } catch (err) {
          statusText.textContent = err.message || "Signup failed.";
        }
      }

      loginBtn.addEventListener("click", handleLogin);
      signupBtn.addEventListener("click", handleSignup);
      passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin();
      });
    });
  </script>
</body>
</html>
