<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Distress Intelligence · Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-auto px-4">
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-full bg-emerald-400 flex items-center justify-center font-bold text-slate-900">
          DI
        </div>
        <div>
          <h1 class="text-lg font-semibold">Distress Intelligence</h1>
          <p class="text-xs text-slate-400">Sign in to access Duval distress data</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Email</label>
          <input id="emailInput"
                 type="email"
                 placeholder="you@example.com"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Password</label>
          <input id="passwordInput"
                 type="password"
                 placeholder="••••••••"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
      </div>

      <div class="mt-4 space-y-2">
        <button id="loginBtn"
                class="w-full rounded-full bg-emerald-400 text-slate-900 text-sm font-medium py-2 hover:bg-emerald-300">
          Log In
        </button>
        <button id="signupBtn"
                class="w-full rounded-full bg-slate-800 text-slate-100 text-sm py-2 border border-slate-600 hover:bg-slate-700">
          Create New Account
        </button>
      </div>

      <p id="statusText" class="mt-3 text-xs text-slate-400 min-h-[1.2rem]"></p>

      <p class="mt-4 text-[11px] text-slate-500 text-center">
        By continuing you agree not to scrape, resell, or abuse this data source.
      </p>
    </div>
  </div>

  <!-- 1) Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>

  <!-- 2) Initialize Firebase (PUT YOUR REAL CONFIG HERE) -->
  <script>
    console.log("Loading Firebase config for login page...");

    // 🔴 REPLACE THIS with your real config from Firebase console
    const firebaseConfig = {
      apiKey: "AIzaSyDTMTNQceT5sbzJVnZknWOWF27G0KzYgPE",
      authDomain: "duval-distress-intelligence.firebaseapp.com",
      projectId: "duval-distress-intelligence",
      storageBucket: "duval-distress-intelligence.firebasestorage.app",
      messagingSenderId: "374769856603",
      appId: "1:374769856603:web:342062e92ef5d1c289cf7e"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      console.log("Firebase initialized on login page:", firebase.apps.length);
    } catch (e) {
      console.error("Error initializing Firebase:", e);
    }
  </script>

  <!-- 3) Page-specific login logic -->
  <script>
    console.log("Login script starting...");

    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const statusText = document.getElementById("statusText");

    if (!emailInput || !passwordInput || !loginBtn || !signupBtn) {
      console.error("Login page elements not found.");
    }

    function setStatus(msg) {
      console.log("STATUS:", msg);
      if (statusText) statusText.textContent = msg;
    }

    // Make sure Firebase is there before we use it
    function requireFirebaseAuth() {
      if (typeof firebase === "undefined") {
        setStatus("Firebase SDK not loaded.");
        console.error("firebase is undefined on login page.");
        return null;
      }
      if (!firebase.auth) {
        setStatus("Firebase auth not available.");
        console.error("firebase.auth is missing on login page.");
        return null;
      }
      return firebase.auth();
    }

    // If already logged in, bounce to dashboard
    try {
      const auth = requireFirebaseAuth();
      if (auth) {
        auth.onAuthStateChanged((user) => {
          if (user) {
            console.log("User already logged in, redirecting to /");
            window.location.href = "/";
          }
        });
      }
    } catch (e) {
      console.error("Error in onAuthStateChanged setup:", e);
    }

    async function handleLogin(event) {
      if (event) event.preventDefault();
      const auth = requireFirebaseAuth();
      if (!auth) return;

      const email = emailInput.value.trim();
      const pass = passwordInput.value;
      if (!email || !pass) {
        setStatus("Enter email and password.");
        return;
      }
      setStatus("Signing in...");
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        setStatus("Success. Redirecting…");
        window.location.href = "/";
      } catch (err) {
        console.error("Login error:", err);
        setStatus(err.message || "Login failed.");
      }
    }

    async function handleSignup(event) {
      if (event) event.preventDefault();
      const auth = requireFirebaseAuth();
      if (!auth) return;

      const email = emailInput.value.trim();
      const pass = passwordInput.value;
      if (!email || !pass) {
        setStatus("Enter email and password.");
        return;
      }
      setStatus("Creating account...");
      try {
        await auth.createUserWithEmailAndPassword(email, pass);
        setStatus("Account created. Redirecting…");
        window.location.href = "/";
      } catch (err) {
        console.error("Signup error:", err);
        setStatus(err.message || "Signup failed.");
      }
    }

    // Attach click handlers
    if (loginBtn) {
      loginBtn.addEventListener("click", handleLogin);
    }
    if (signupBtn) {
      signupBtn.addEventListener("click", handleSignup);
    }
    if (passwordInput) {
      passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleLogin(e);
      });
    }

    console.log("Login script finished binding events.");
  </script>
</body>
</html>
