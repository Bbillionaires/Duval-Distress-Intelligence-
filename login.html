<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distress Intelligence · Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0f172a; /* slate-950 */
      color: #f8fafc; /* slate-100 */
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md mx-auto px-4">
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-full bg-emerald-400 flex items-center justify-center font-bold text-slate-900">
          DI
        </div>
        <div>
          <h1 class="text-lg font-semibold">Distress Intelligence</h1>
          <p class="text-xs text-slate-400">Sign in to access Duval distress data</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Email</label>
          <input id="emailInput"
                 type="email"
                 placeholder="you@example.com"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Password</label>
          <input id="passwordInput"
                 type="password"
                 placeholder="••••••••"
                 class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm outline-none focus:border-emerald-400">
        </div>
      </div>

      <div class="mt-4 space-y-2">
        <button id="loginBtn"
                class="w-full rounded-full bg-emerald-400 text-slate-900 text-sm font-medium py-2 hover:bg-emerald-300">
          Log In
        </button>
        <button id="signupBtn"
                class="w-full rounded-full bg-slate-800 text-slate-100 text-sm py-2 border border-slate-600 hover:bg-slate-700">
          Create New Account
        </button>
      </div>

      <p id="statusText" class="mt-3 text-xs text-slate-400 min-h-[1.2rem] text-center"></p>

      <p class="mt-4 text-[11px] text-slate-500 text-center">
        By continuing you agree not to scrape, resell, or abuse this data source.
      </p>
    </div>
  </div>

  <!-- ✅ Firebase SDKs (Compat version) -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>

  <!-- 🔑 Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDTMTNQceT5sbzJVnZknWOWF27G0KzYgPE",
      authDomain: "duval-distress-intelligence.firebaseapp.com",
      projectId: "duval-distress-intelligence",
      storageBucket: "duval-distress-intelligence.firebasestorage.app",
      messagingSenderId: "374769856603",
      appId: "1:374769856603:web:342062e92ef5d1c289cf7e"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      console.log("✅ Firebase initialized");
    } else {
      console.log("⚠️ Firebase already initialized");
    }
  </script>

  <!-- 🧠 Login Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");
      const statusText = document.getElementById("statusText");

      function setStatus(msg) {
        statusText.textContent = msg;
      }

      // Redirect if already logged in
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          console.log("Logged in as:", user.email);
          window.location.href = "/";
        }
      });

      // Log In handler
      loginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pass = passwordInput.value;
        if (!email || !pass) return setStatus("Enter email and password");
        setStatus("Signing in...");
        try {
          await firebase.auth().signInWithEmailAndPassword(email, pass);
          setStatus("Login successful. Redirecting...");
          window.location.href = "/";
        } catch (err) {
          console.error(err);
          setStatus(err.message);
        }
      };

      // Create Account handler
      signupBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pass = passwordInput.value;
        if (!email || !pass) return setStatus("Enter email and password");
        setStatus("Creating account...");
        try {
          await firebase.auth().createUserWithEmailAndPassword(email, pass);
          setStatus("Account created! Redirecting...");
          window.location.href = "/";
        } catch (err) {
          console.error(err);
          setStatus(err.message);
        }
      };
    });
  </script>
</body>
</html>
