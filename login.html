<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - Distress Intelligence</title>
  <style>
    body{font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f6f7fb;margin:0}
    .box{width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h2{margin:0 0 12px 0}
    label{display:block;font-size:12px;color:#444;margin-top:10px}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:6px}
    button{width:100%;padding:10px;border:0;border-radius:10px;background:#111;color:#fff;margin-top:14px;cursor:pointer}
    .muted{font-size:12px;color:#666;margin-top:10px}
    .err{color:#b00020;font-size:12px;margin-top:10px;white-space:pre-wrap}
    .row{display:flex;gap:8px;margin-top:10px}
    .row button{width:50%;background:#333}
    .row button.secondary{background:#666}
  </style>
</head>
<body>
  <div class="box">
    <h2>Admin Login</h2>
    <div class="muted">Use your Render ENV: ADMIN_EMAIL + ADMIN_PASSWORD</div>

    <label>Email</label>
    <input id="email" placeholder="admin@local" />

    <label>Password</label>
    <input id="pw" type="password" placeholder="••••••••" />

    <button onclick="login()">Login</button>

    <div class="row">
      <button class="secondary" onclick="location.href='/'">Home</button>
      <button onclick="location.href='/admin'">Admin</button>
    </div>

    <div id="out" class="err"></div>
  </div>

<script>
async function login(){
  const email = (document.getElementById("email").value || "admin@local").trim();
  const password = (document.getElementById("pw").value || "").trim();
  const res = await fetch("/api/login", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({email,password})
  });
  const txt = await res.text();
  if(res.ok){
    location.href="/admin";
    return;
  }
  document.getElementById("out").textContent = txt;
}
</script>
</body>
</html>
