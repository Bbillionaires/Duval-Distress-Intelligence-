<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Real Estate Intelligence</title>
<style>
* { box-sizing:border-box;margin:0;padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px; }
.card { background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;text-align:center;color:#fff; }
.icon { font-size:48px;margin-bottom:12px; }
.title { font-size:26px;font-weight:800;margin-bottom:6px; }
.sub { font-size:14px;opacity:0.8;margin-bottom:28px; }
.form-group { margin-bottom:16px;text-align:left; }
.form-label { display:block;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.8;margin-bottom:6px; }
.form-input { width:100%;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);border-radius:10px;padding:12px 16px;font-size:15px;color:#fff;outline:none;transition:all 0.2s; }
.form-input::placeholder { color:rgba(255,255,255,0.5); }
.form-input:focus { background:rgba(255,255,255,0.28);border-color:rgba(255,255,255,0.7); }
.btn { width:100%;padding:14px;background:#fff;color:#764ba2;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;transition:all 0.2s;margin-top:8px; }
.btn:hover { background:#f0e8ff;transform:translateY(-1px); }
.btn:disabled { opacity:0.6;transform:none;cursor:not-allowed; }
.msg { border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;display:none;text-align:left; }
.msg.error { background:rgba(239,68,68,0.25);border:1px solid rgba(239,68,68,0.5); }
.msg.success { background:rgba(34,197,94,0.25);border:1px solid rgba(34,197,94,0.5); }
.back { display:inline-block;margin-top:20px;font-size:13px;color:rgba(255,255,255,0.7);text-decoration:none; }
.back:hover { color:#fff; }
.strength-bar { height:4px;border-radius:2px;margin-top:6px;background:rgba(255,255,255,0.2);overflow:hidden; }
.strength-fill { height:100%;border-radius:2px;transition:width 0.3s,background 0.3s; }
</style>
</head>
<body>

<!-- FORGOT PASSWORD -->
<div class="card" id="forgot-card">
  <div class="icon">🔐</div>
  <div class="title">Forgot Password?</div>
  <div class="sub">Enter your email and we'll send you a reset link</div>
  <div class="msg error" id="forgot-err"></div>
  <div class="msg success" id="forgot-ok"></div>
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input type="email" class="form-input" id="forgot-email" placeholder="your@email.com" autocomplete="email">
  </div>
  <button class="btn" id="forgot-btn" onclick="submitForgot()">Send Reset Link</button>
  <a href="/login" class="back">← Back to Login</a>
</div>

<!-- RESET PASSWORD -->
<div class="card" id="reset-card" style="display:none">
  <div class="icon">🔑</div>
  <div class="title">Set New Password</div>
  <div class="sub">Choose a strong password for your account</div>
  <div class="msg error" id="reset-err"></div>
  <div class="msg success" id="reset-ok"></div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input type="password" class="form-input" id="reset-pw" placeholder="Min 8 characters" oninput="checkStrength()">
    <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
  </div>
  <div class="form-group">
    <label class="form-label">Confirm Password</label>
    <input type="password" class="form-input" id="reset-pw2" placeholder="Repeat password">
  </div>
  <button class="btn" id="reset-btn" onclick="submitReset()">Reset Password</button>
  <a href="/login" class="back">← Back to Login</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

// If token in URL → show reset form, else show forgot form
if (token) {
  document.getElementById('forgot-card').style.display = 'none';
  document.getElementById('reset-card').style.display = 'block';
  // Verify token is still valid
  fetch(`/api/verify-reset-token/${token}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) {
        showMsg('reset-err', d.error || 'This reset link is invalid or expired.');
        document.getElementById('reset-btn').disabled = true;
      }
    }).catch(() => {});
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (token) submitReset();
    else submitForgot();
  }
});

async function submitForgot() {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) { showMsg('forgot-err', 'Please enter your email address.'); return; }
  const btn = document.getElementById('forgot-btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  hideMsg('forgot-err'); hideMsg('forgot-ok');
  try {
    const r = await fetch('/api/forgot-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (d.ok) {
      showMsg('forgot-ok', '✅ Check your email for a reset link. It expires in 1 hour.');
      btn.textContent = 'Email Sent';
    } else {
      showMsg('forgot-err', d.error || 'Something went wrong. Try again.');
      btn.disabled = false; btn.textContent = 'Send Reset Link';
    }
  } catch(e) {
    showMsg('forgot-err', 'Connection error. Please try again.');
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
}

async function submitReset() {
  const pw = document.getElementById('reset-pw').value;
  const pw2 = document.getElementById('reset-pw2').value;
  if (pw.length < 8) { showMsg('reset-err', 'Password must be at least 8 characters.'); return; }
  if (pw !== pw2) { showMsg('reset-err', 'Passwords do not match.'); return; }
  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Resetting…';
  hideMsg('reset-err'); hideMsg('reset-ok');
  try {
    const r = await fetch('/api/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: pw })
    });
    const d = await r.json();
    if (d.ok) {
      showMsg('reset-ok', '✅ Password reset! Redirecting to login…');
      setTimeout(() => window.location.href = '/login', 2000);
    } else {
      showMsg('reset-err', d.error || 'Reset failed. The link may have expired.');
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
  } catch(e) {
    showMsg('reset-err', 'Connection error. Please try again.');
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
}

function checkStrength() {
  const pw = document.getElementById('reset-pw').value;
  const fill = document.getElementById('strength-fill');
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['#ef4444','#f97316','#fbbf24','#22c55e','#16a34a'];
  fill.style.width = (score * 20) + '%';
  fill.style.background = colors[score - 1] || '#ef4444';
}

function showMsg(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function hideMsg(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
