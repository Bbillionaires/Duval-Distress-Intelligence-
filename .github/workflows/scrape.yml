name: Run Duval Tax Scraper

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday at 8:00 UTC
  workflow_dispatch:       # allows manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scrape_duval_tax_to_leads.py

      - name: Commit updated leads.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.csv
          git commit -m "Automated update of leads.csv" || echo "No changes to commit"
          git push
